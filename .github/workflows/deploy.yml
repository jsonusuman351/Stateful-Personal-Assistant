name: Deploy

# Triggers on merges to main, or manually via GitHub Actions UI / gh CLI.
# Pull requests never trigger this workflow — CI handles those.
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  # ── Stage 1: Build Docker image and push to GHCR ─────────────────────────────
  build-and-push:
    name: Build and push Docker image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write   # required to push to ghcr.io
    outputs:
      image_tag: ${{ steps.meta.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          # GITHUB_TOKEN is automatically provided — no secret required for GHCR.
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/stateful-personal-assistant
          tags: |
            # Short commit SHA — immutable tag per deploy (e.g. sha-a1b2c3d)
            type=sha,prefix=sha-,format=short
            # Always update :latest on main
            type=raw,value=latest

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # GitHub Actions layer cache — subsequent pushes reuse unchanged layers.
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ── Stage 2: Deploy to Render ─────────────────────────────────────────────────
  deploy:
    name: Deploy to Render (production)
    runs-on: ubuntu-latest
    needs: build-and-push
    # References the "production" GitHub Environment.
    # Configure required reviewers in:
    #   Repo → Settings → Environments → production → Required reviewers
    # The job pauses here until an approved reviewer clicks "Approve and deploy".
    environment: production
    steps:
      - name: Deploy to Render
        env:
          # Option A (recommended) — Render API key + service ID.
          # Enables status polling so the job fails if the Render deploy fails.
          # Set both RENDER_API_KEY and RENDER_SERVICE_ID in GitHub Secrets.
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}
          # Option B (fallback) — bare deploy hook.
          # Fire-and-forget: job succeeds immediately after the POST.
          # Only used when RENDER_API_KEY / RENDER_SERVICE_ID are not set.
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
          IMAGE_TAG: ${{ needs.build-and-push.outputs.image_tag }}
        run: |
          if [ -n "$RENDER_API_KEY" ] && [ -n "$RENDER_SERVICE_ID" ]; then
            echo "Triggering deploy via Render API (image tag: $IMAGE_TAG)..."

            DEPLOY_RESPONSE=$(curl -fsSL -X POST \
              "https://api.render.com/v1/services/${RENDER_SERVICE_ID}/deploys" \
              -H "Authorization: Bearer ${RENDER_API_KEY}" \
              -H "Content-Type: application/json" \
              -d '{"clearCache":"do_not_clear"}')

            DEPLOY_ID=$(echo "$DEPLOY_RESPONSE" \
              | python3 -c "import sys,json; print(json.load(sys.stdin)['id'])")
            echo "Deploy ID: $DEPLOY_ID"
            echo "Polling status every 10 s (timeout 10 min)..."

            for i in $(seq 1 60); do
              STATUS=$(curl -fsSL \
                "https://api.render.com/v1/services/${RENDER_SERVICE_ID}/deploys/${DEPLOY_ID}" \
                -H "Authorization: Bearer ${RENDER_API_KEY}" \
                | python3 -c "import sys,json; print(json.load(sys.stdin)['status'])")
              echo "  attempt $i / 60: $STATUS"
              case "$STATUS" in
                live)
                  echo "Deploy succeeded."
                  exit 0
                  ;;
                deactivated|build_failed|update_failed|canceled)
                  echo "Deploy failed with status: $STATUS"
                  exit 1
                  ;;
              esac
              sleep 10
            done

            echo "Deploy timed out after 10 minutes — check Render dashboard."
            exit 1

          elif [ -n "$RENDER_DEPLOY_HOOK_URL" ]; then
            echo "Triggering deploy via Render deploy hook (fire-and-forget)..."
            curl -fsSL -X POST "$RENDER_DEPLOY_HOOK_URL"
            echo "Hook triggered. Monitor progress in the Render dashboard."

          else
            echo "ERROR: no deploy credentials configured."
            echo "Set RENDER_API_KEY + RENDER_SERVICE_ID (recommended)"
            echo "or RENDER_DEPLOY_HOOK_URL (fallback) in GitHub Secrets."
            exit 1
          fi
